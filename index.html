<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms culturama</title>
</head>

<body>
    <header>
        <h1>Pesquisa Online Culturama</h1>
    </header>

    <section>
        <form action="#" method="get">
            <!-- Dados pessoais -->
            <fieldset>
                <legend>Dados pessoais</legend>
                <label for="name">Nome</label>
                <input id="name" type="text" name="UserName" placeholder="Nome e sobrenome" required>
                <br>
                <label for="age">Idade</label>
                <input id="age" type="number" name="userAge" placeholder="Idade" min="12" max="100" required>
                <br>
                <label for="date">Data de Nascimento</label>
                <input id="date" type="date" name="birthDate" required>
                <br>
                <label for="email">E-mail</label>
                <input id="email" type="email" name="userEmail" placeholder="E-mail" required>
                <br>
                <label for="phoneNumber">Telefone</label>
                <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9] {11}"
                    placeholder="Numero celular">
                <br>
                <label for="image">Upload de foto</label>
                <!-- para definir qual tipo de imagem: accept="image/png, image/jpeg"  -->
                <input id="image" type="file" accept="image/*" name="userImage">
                <br>
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <input id="fem" type="radio" name="userGender" value="feminino" required>
                <label for="fem">Feminino</label>
                <input id="masc" type="radio" name="userGender" value="masculino" required>
                <label for="masc">Masculino</label>
                <input id="notInformed" type="radio" name="userGender" value="usernotInformed">
                <label for="notInformed">Prefirino não informar</label>
                <br>
                <label for="userMaritalState">Selecione seu estado civil</label>
                <!-- Lista suspensa -->
                <select id="userMaritalState" name="maritalState">
                    <option value="notInformed">Selecione</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="estavelCasado">Uniao estavél</option>
                    <option value="divorciado">Divorciado</option>
                </select>
                <br>
                <label for="userState">Selecione seu estado</label>
                <select id="userState" name="state" required>
                    <option value="notInformed">Selecione</option>
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espiritoSanto">Espirito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                    <option value="matoGrosso">Mato Grosso</option>
                    <option value="minasGerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="rioDeJaneiro">Rio de Janeiro</option>
                    <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                    <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                    <option value="rondonia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santaCatarina">Santa Catarina</option>
                    <option value="saoPaulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>

                <label for="userCity"></label>
                <input type="text" name="userCity" placeholder="Digite sua cidade" required>

            </fieldset>

            <fieldset>
                <legend>Redes sociais</legend>
                <input id="instagram" type="checkbox" name="social" value="instagram">
                <label for="instagram">instagram</label>
                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label for="facebook">Facebook</label>
                <input id="linkedin" type="checkbox" name="social" value="linkedin">
                <label for="linkedin">linkedin</label>
                <br>
                <label for="userMusicStyle">Estilo musical</label>
                <input list="styleTipes" id="userMusicStyle" type="text" name="music">
                <datalist id="styleTipes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Samba">
                    <option value="Sertanejo">
                </datalist>
                <br>
                <label for="userColor">Cor favorita</label>
                <input type="color" name="userColor" id="userColor">

            </fieldset>

            <fieldset>
                <legend>Opinião de usuário</legend>

                <input type="radio" id="otimo" name="userOpinion" value="otimo" required>
                <label for="otimo">Ótimo    </label><br>
                <input type="radio" id="bom" name="userOpinion" value="bom" required>
                <label for="bom">Bom    </label><br>
                <input type="radio" id="ruim" name="userOpinion" value="ruim" required>
                <label for="ruim">Ruim  </label><br>

                <br>
                <label for="userOpinionDescription">Descreva sua opnião</label><br>
                <textarea id="userOpinionDescription" placeholder="Opinião de usuário"></textarea>
            </fieldset>
            <button type="submit">Enviar</button>
        </form>

    </section>

</body>

</html>
